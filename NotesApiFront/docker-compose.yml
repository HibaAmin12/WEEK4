services:

  # ==========================================================
  # PostgreSQL Database
  # ==========================================================

  db:
    image: postgres:16

    environment:
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_pass
      POSTGRES_DB: notes_db

    # PostgreSQL is available on localhost:5433
    ports:
      - "5433:5432"

    # Use the existing PostgreSQL volume
    volumes:
      - postgres_data:/var/lib/postgresql/data


  # ==========================================================
  # FastAPI Backend
  # ==========================================================

  api:
    build:
      context: ./Day4project

    # FastAPI is available on localhost:8000
    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://notes_user:notes_pass@db:5432/notes_db

    depends_on:
      - db


  # ==========================================================
  # React Frontend
  # ==========================================================

  frontend:
    build:
      context: ./notes-frontend

    # React/Vite is available on localhost:5173
    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:8000

    depends_on:
      - api


# ==========================================================
# PostgreSQL Persistent Volume
# ==========================================================

# Use the existing volume from the original Notes API project.
# This preserves the existing users, admins, notes and categories.

volumes:
  postgres_data:
    external: true
    name: day4project_postgres_data